# SPDX-License-Identifier: MIT OR Apache-2.0
[workspace]
resolver = "3"
members = ["radiopost", "api", "rpmi", "issuer", "tester", "postoffice", "gateway", "update", "../adapters/aether", "../adapters/tcp", "../app/client"]

[workspace.package]
version = "0.1.0-beta.7"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KK4ODA/RadioPost"
authors = ["RadioPost contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Field and key numbers are the specifications' own; naming each would make review harder.
unreadable_literal = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
