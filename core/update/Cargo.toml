# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "radiopost-update"
description = "RadioPost's updates: what the update channel offers, whether it is newer, its signature checked with the project's key, and the command-line programs replaced."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
base64 = "0.22"
minisign-verify = "0.2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ureq = "3"
zip = { version = "7", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tiny_http = "0.12"

[lints]
workspace = true
