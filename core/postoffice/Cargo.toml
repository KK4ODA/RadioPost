# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "radiopost-postoffice"
description = "A RadioPost post office's service: accounts, credentials, sessions and copies (RP-5), its public documents (RP-1 §7), served over HTTP."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "radiopost-po"
path = "src/main.rs"

[dependencies]
radiopost = { path = "../radiopost" }
radiopost-api = { path = "../api" }
ureq = "3"
ed25519-dalek = "3"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tiny_http = "0.12"
mail-parser = { version = "0.11", features = ["full_encoding"] }
unicode-normalization = "0.1"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "rustls-tls", "hostname"] }
# SPF, DKIM and DMARC when the mail server gives the door no verdicts (RP-6 §2.1). 0.13 is the
# last series on mail-parser 0.11, which keeps the workspace on Rust 1.85; pure-Rust crypto.
mail-auth = { version = "0.13", default-features = false, features = ["rust-crypto", "dns-hickory"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
radiopost-tester = { path = "../tester" }
sha2 = "0.11"
# `test`: a lookup the tests have not given an answer is NXDOMAIN, never the network.
mail-auth = { version = "0.13", default-features = false, features = ["rust-crypto", "dns-hickory", "test"] }

[lints]
workspace = true
