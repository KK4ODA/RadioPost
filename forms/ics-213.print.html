<!-- How an ICS-213 General Message prints: as FEMA's ICS 213 (a United States government form in
     the public domain), its blocks numbered as there. The programs put each field's value in the
     place marked with its number (data-field), as text; the signature lines stay blank, to sign
     on paper. Only for the template with this fingerprint (data-template): another template is
     another form. -->
<section class="ics213" data-template="25393c52580e7a3c">
<style>
.ics213 { color: #000; background: #fff; font: 10.5pt/1.3 Arial, Helvetica, sans-serif; }
.ics213 table { width: 100%; border-collapse: collapse; table-layout: fixed; }
.ics213 td { border: 1px solid #000; padding: 4pt 6pt; vertical-align: top; }
.ics213 h1 { font-size: 13pt; text-align: center; margin: 0 0 6pt; letter-spacing: .02em; }
.ics213 b { font-size: 9pt; }
.ics213 [data-field] { font-size: 11pt; overflow-wrap: anywhere; }
.ics213 col { width: 12.5%; }
.ics213 .box { white-space: pre-wrap; display: block; margin-top: 3pt; }
.ics213 .message { height: 3.6in; }
.ics213 .reply { height: 1.9in; }
.ics213 .sign { height: 16pt; }
.ics213 .foot { border: 0; padding: 3pt 0 0; font-size: 9pt; }
</style>
<h1>GENERAL MESSAGE (ICS 213)</h1>
<table>
  <colgroup><col><col><col><col><col><col><col><col></colgroup>
  <tr><td colspan="8"><b>1. Incident Name (Optional):</b> <span data-field="1"></span></td></tr>
  <tr><td colspan="8"><b>2. To (Name and Position):</b> <span data-field="2"></span></td></tr>
  <tr><td colspan="8"><b>3. From (Name and Position):</b> <span data-field="3"></span></td></tr>
  <tr>
    <td colspan="4"><b>4. Subject:</b> <span data-field="4"></span></td>
    <td colspan="2"><b>5. Date:</b> <span data-field="5"></span></td>
    <td colspan="2"><b>6. Time:</b> <span data-field="6"></span></td>
  </tr>
  <tr><td colspan="8" class="message"><b>7. Message:</b> <span class="box" data-field="7"></span></td></tr>
  <tr>
    <td colspan="5"><b>8. Approved by: Name and Position/Title:</b> <span data-field="8"></span></td>
    <td colspan="3" class="sign"><b>Signature:</b></td>
  </tr>
  <tr><td colspan="8" class="reply"><b>9. Reply:</b> <span class="box" data-field="9"></span></td></tr>
  <tr>
    <td colspan="4"><b>10. Replied by: Name and Position/Title:</b> <span data-field="10"></span></td>
    <td colspan="2" class="sign"><b>Signature:</b></td>
    <td colspan="2"><b>Date/Time:</b> <span data-field="11"></span></td>
  </tr>
  <tr><td colspan="8" class="foot">ICS 213, Page 1</td></tr>
</table>
</section>
