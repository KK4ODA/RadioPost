# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "radiopost-client"
description = "The RadioPost client: the user's key, credential and mail, and RP-3 sessions over any RPMI modem."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# a member of the core workspace, so one lockfile and one CI job hold every crate
workspace = "../../core"

[[bin]]
name = "radiopost"
path = "src/main.rs"

[dependencies]
radiopost = { path = "../../core/radiopost" }
radiopost-api = { path = "../../core/api" }
radiopost-update = { path = "../../core/update" }
rpmi = { path = "../../core/rpmi" }
radiopost-aether = { path = "../../adapters/aether" }
# places, the GPS, terrain and HF predictions, shared with hf-predict (choosing a gateway, §§6, 8,
# 10, 11): its libraries, by revision, until hf-predict tags them
radioprop-hf = { git = "https://github.com/KK4ODA/hf-predict", rev = "0503d40f9a2a9577817559b1681d25b6dcf801cc" }
radioprop-geo = { git = "https://github.com/KK4ODA/hf-predict", rev = "0503d40f9a2a9577817559b1681d25b6dcf801cc" }
radioprop-place = { git = "https://github.com/KK4ODA/hf-predict", rev = "0503d40f9a2a9577817559b1681d25b6dcf801cc" }
radioprop-terrain = { git = "https://github.com/KK4ODA/hf-predict", rev = "0503d40f9a2a9577817559b1681d25b6dcf801cc" }
ed25519-dalek = "3"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: learning reads back the records and its own cache, and a float parsed to the last
# bit is what makes the same records give the same estimates (selection::learning)
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
tiny_http = "0.12"
# terrain tiles from the Copernicus DEM's public bucket (selection::terrain)
# the terrain map's background, a PNG (and its CRC)
flate2 = "1"
ureq = "3"
unicode-normalization = "0.1"

[dev-dependencies]
radiopost-tester = { path = "../../core/tester" }
radiopost-postoffice = { path = "../../core/postoffice" }
# a stand-in for Aether's control API, for the app's connection between calls
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
# Aether's port held until it starts (bound, not listening), so no other test's listener takes it
socket2 = "0.6"

[lints]
workspace = true
