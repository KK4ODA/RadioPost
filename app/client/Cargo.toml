# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "radiopost-client"
description = "The RadioPost client: the user's key, credential and mail, and RP-3 sessions over any RPMI modem."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# a member of the core workspace, so one lockfile and one CI job hold every crate
workspace = "../../core"

[[bin]]
name = "radiopost"
path = "src/main.rs"

[dependencies]
radiopost = { path = "../../core/radiopost" }
radiopost-api = { path = "../../core/api" }
radiopost-update = { path = "../../core/update" }
rpmi = { path = "../../core/rpmi" }
radiopost-aether = { path = "../../adapters/aether" }
ed25519-dalek = "3"
getrandom = "0.3"
serde_json = { version = "1", features = ["preserve_order"] }
tiny_http = "0.12"
unicode-normalization = "0.1"

[dev-dependencies]
radiopost-tester = { path = "../../core/tester" }
radiopost-postoffice = { path = "../../core/postoffice" }

[lints]
workspace = true
