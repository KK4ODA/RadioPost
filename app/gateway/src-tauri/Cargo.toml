# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "radiopost-gateway-app"
description = "RadioPost Gateway, the desktop application: the gateway and its panel in a window of its own."
version = "0.1.0-beta.12"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KK4ODA/RadioPost"
authors = ["RadioPost contributors"]

# Not a member of core's workspace: Tauri needs WebKitGTK on Linux, which the core's CI job does
# without. CI builds this package in a job of its own.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
radiopost-gateway = { path = "../../../core/gateway" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
# the configuration Tauri builds into the program, its plugins' among it
serde_json = "1"
radiopost-update = { path = "../../../core/update" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unreadable_literal = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
