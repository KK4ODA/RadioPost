# SPDX-License-Identifier: MIT OR Apache-2.0
#
# The installers and the command-line tools, for Windows, macOS and Linux.
#
# A pushed tag v* makes a pre-release of that name. Started by hand with a `tag` (v0.1.0-beta.1),
# it makes that public pre-release and the tag, on the commit it ran on; started by hand without
# one, the build becomes a draft release, which only the repository's maintainers see until one
# publishes it. The installers are
# not signed yet: Windows' SmartScreen and macOS' Gatekeeper warn (the client's README says how to
# open them).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "A tag such as v0.1.0-beta.1 for a public pre-release; empty for a draft"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build · ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04, so the packages run on the older systems still in use
          - { os: ubuntu-22.04, name: linux-x64, bundles: "deb,appimage" }
          - { os: windows-latest, name: windows-x64, bundles: "nsis,msi" }
          - { os: macos-latest, name: macos-arm64, bundles: "app,dmg" }
    steps:
      - uses: actions/checkout@v7

      - name: Install the system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev \
            libayatana-appindicator3-dev

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node, for Tauri's command line
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: The desktop application's installers
        working-directory: app/src-tauri
        shell: bash
        run: npx --yes @tauri-apps/cli@2 build --bundles ${{ matrix.bundles }}

      - name: The command-line tools
        working-directory: core
        run: >
          cargo build --release --locked -p radiopost-client -p radiopost-aether -p rpmi
          -p radiopost-issue -p radiopost-tcp -p radiopost-tester -p radiopost-gateway
          -p radiopost-postoffice

      - name: Collect
        shell: bash
        run: |
          set -euo pipefail
          exe=""
          [ "$RUNNER_OS" = "Windows" ] && exe=".exe"
          tools="radiopost-tools-${{ matrix.name }}"
          mkdir -p "out/$tools"
          for b in radiopost radiopost-aether radiopost-tcp rpmi-loopback radiopost-issue \
              radiopost-tester radiopost-gateway radiopost-po; do
            cp "core/target/release/$b$exe" "out/$tools/"
          done
          cp LICENSE-MIT LICENSE-APACHE app/client/README.md "out/$tools/"
          # bsdtar (Windows, macOS) writes a zip; GNU tar (Linux) cannot
          if [ "$RUNNER_OS" = "Linux" ]; then
            (cd out && zip -qr "$tools.zip" "$tools")
          else
            (cd out && tar -a -c -f "$tools.zip" "$tools")
          fi
          rm -r "out/$tools"
          find app/src-tauri/target/release/bundle -maxdepth 2 -type f \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.msi' -o -name '*-setup.exe' \
               -o -name '*.dmg' \) -exec cp {} out/ \;
          ls -l out

      - uses: actions/upload-artifact@v7
        with:
          name: radiopost-${{ matrix.name }}
          path: out/*
          retention-days: 3

  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: The release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ASKED: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"; kind="--prerelease"
          elif [ -n "${ASKED}" ]; then
            case "${ASKED}" in
              v[0-9]*) tag="${ASKED}"; kind="--prerelease" ;;
              *) echo "a release tag starts with v and a digit: ${ASKED}"; exit 1 ;;
            esac
          else
            tag="build-${GITHUB_RUN_NUMBER}"; kind="--draft --prerelease"
          fi
          notes="Built from ${GITHUB_SHA::7}. The installers are not signed yet: Windows'
          SmartScreen asks once (More info, Run anyway), and on macOS open the app with Control-click,
          Open. The tools archive holds radiopost, radiopost-aether, radiopost-tcp, rpmi-loopback,
          radiopost-issue, radiopost-tester, radiopost-gateway and radiopost-po. SHA256SUMS lists
          every file's checksum."
          gh release create "$tag" dist/* $kind --target "$GITHUB_SHA" \
            --title "RadioPost ${tag}" --notes "$notes"
