# SPDX-License-Identifier: MIT OR Apache-2.0
#
# Every push to main and every pull request: the Python is linted and formatted, the test vectors
# are what the reference makes, the figures are what their generators draw, the documents'
# versions, links and cross-references agree, and the user's manual's and the server guide's
# contents and pictures are current (standard library only: nothing is installed but
# Python and ruff). The Rust workspace in core/ is formatted, linted and tested against the vectors,
# and the two desktop applications (app/src-tauri, the client, and app/gateway/src-tauri, the
# gateway; Tauri) are built, linted and tested on their own.
name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check · py${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the oldest the code is written for (ruff.toml); 3.13 checks that a newer
        # standard library (zlib above all) makes the same vectors.
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      # ruff is pinned: ruff.toml turns on preview rules, which change between versions.
      - name: Lint
        run: uvx ruff@0.16.9 check --output-format github .

      - name: Format
        run: uvx ruff@0.16.9 format --check .

      - name: Test vectors match the reference
        run: uv run --no-project --python ${{ matrix.python }} tools/vectors/make.py --check

      - name: Figures match their generators
        run: |
          uv run --no-project --python ${{ matrix.python }} tools/figures/concept.py
          uv run --no-project --python ${{ matrix.python }} tools/figures/design.py
          uv run --no-project --python ${{ matrix.python }} tools/figures/manual.py
          uv run --no-project --python ${{ matrix.python }} tools/figures/server.py
          uv run --no-project --python ${{ matrix.python }} tools/figures/icons.py --check
          git status --porcelain
          git diff --stat --exit-code
          test -z "$(git status --porcelain)"

      - name: Versions, links and cross-references
        run: uv run --no-project --python ${{ matrix.python }} tools/check_docs.py

      - name: One version in every program
        run: uv run --no-project --python ${{ matrix.python }} tools/release.py check

      - name: A release's notes can name its announced changes
        run: uv run --no-project --python ${{ matrix.python }} tools/announced.py --self-test

      - name: The user's manual and the server guide agree with themselves
        run: uv run --no-project --python ${{ matrix.python }} tools/manual/build.py check

  core:
    name: core · rust
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Format
        working-directory: core
        run: cargo fmt --all -- --check

      - name: Lint
        working-directory: core
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: The library, the adapters and the client against the vectors
        working-directory: core
        run: cargo test --locked

      # the VOACAP engine the release bundles, fetched and checked as the release does it, and
      # the client's HF predictions run on it (choosing a gateway, §§10, 11.2)
      - name: HF predictions with the pinned VOACAP engine
        run: |
          python3 tools/engine/fetch.py get linux-x64 "$RUNNER_TEMP/engine"
          cd core
          RADIOPOST_VOACAP="$RUNNER_TEMP/engine" cargo test --locked -p radiopost-client --test hf -- --ignored

      # every installer and the tools archive carry the licence of every crate the programs are
      # built from (tools/stage_docs.py, at release): a new dependency that ships no licence text
      # the tool can find or hold is caught here, not at the release
      - name: Every crate's licence has a text
        run: python3 tools/third_party_licenses.py > /dev/null

      - name: The panels parse
        # modules, as the pages load them: .mjs copies, since node reads a .js file as a script
        run: |
          cp app/ui/app.js "$RUNNER_TEMP/app.mjs"
          node --check "$RUNNER_TEMP/app.mjs"
          cp app/gateway/ui/app.js "$RUNNER_TEMP/gateway.mjs"
          node --check "$RUNNER_TEMP/gateway.mjs"
          cp app/ui/map.js "$RUNNER_TEMP/map.mjs"
          node --check "$RUNNER_TEMP/map.mjs"
          cp app/ui/terrain.js "$RUNNER_TEMP/terrain.mjs"
          node --check "$RUNNER_TEMP/terrain.mjs"

      - name: The client's world map against cases worked by hand
        run: node tools/map/check.mjs

  app:
    name: app · ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: desktop, dir: app/src-tauri }
          - { name: gateway, dir: app/gateway/src-tauri }
    steps:
      - uses: actions/checkout@v7

      # Tauri's WebKitGTK window and what it links on Linux
      - name: Install the system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev \
            libayatana-appindicator3-dev

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.dir }}
          # kept from main only: Actions storage is shared across the account
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        working-directory: ${{ matrix.dir }}
        run: cargo fmt -- --check

      - name: Lint
        working-directory: ${{ matrix.dir }}
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: ${{ matrix.dir }}
        run: cargo test --locked
