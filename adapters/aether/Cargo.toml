# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "radiopost-aether"
description = "An RPMI adapter (RP-4) for the Aether HF modem: each host a claim on Aether's control API (RP-4 §9.1)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# a member of the core workspace, so one lockfile and one CI job hold every crate
workspace = "../../core"

[dependencies]
rpmi = { path = "../../core/rpmi" }
serde_json = { version = "1", features = ["preserve_order"] }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

[dev-dependencies]
radiopost = { path = "../../core/radiopost" }
ed25519-dalek = "3"

[lints]
workspace = true
