# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "radiopost-mercury"
description = "An RPMI adapter (RP-4) for the Mercury HF modem, through its VARA-style TNC interface (RP-4 §9.6)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# a member of the core workspace, so one lockfile and one CI job hold every crate
workspace = "../../core"

[dependencies]
rpmi = { path = "../../core/rpmi" }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
radiopost-tester = { path = "../../core/tester" }

[lints]
workspace = true
