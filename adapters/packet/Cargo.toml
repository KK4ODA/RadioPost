# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "radiopost-packet"
description = "An RPMI adapter (RP-4) for AX.25 packet, through a TNC's AGWPE port such as Dire Wolf's (RP-4 §9.4)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# a member of the core workspace, so one lockfile and one CI job hold every crate
workspace = "../../core"

[dependencies]
rpmi = { path = "../../core/rpmi" }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
radiopost-tester = { path = "../../core/tester" }

[lints]
workspace = true
