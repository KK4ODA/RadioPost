# Lint and format settings for RadioPost's Python (the figure generators and the vectors' reference).
line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "SIM", "PL"]
preview = true
ignore = [
  "too-many-arguments", # drawing calls legitimately take many parameters
  "magic-value-comparison", # figure coordinates are literals by nature
  "too-many-statements", # a figure is one long function
  # A strict decoder and a step-by-step verifier return at each check.
  "too-many-return-statements",
  "too-many-branches",
  # Unicode punctuation in labels and docstrings.
  "ambiguous-unicode-character-string",
  "ambiguous-unicode-character-docstring",
  "ambiguous-unicode-character-comment",
]

[format]
quote-style = "double"

[lint.per-file-ignores]
# A vector builder names every value it writes, so a reader can follow it to the file.
"tools/vectors/make.py" = ["too-many-locals"]
