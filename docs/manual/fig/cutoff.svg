<text xml:space="preserve" x="38.0" y="94.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1e293b" text-anchor="start">Usual gateways</text>
<text xml:space="preserve" x="38.0" y="117.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">KK4ODA-1 ticked,</text>
<text xml:space="preserve" x="38.0" y="136.6" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">then Save</text>
<g fill="none" stroke="#1d4ed8" stroke-width="1.6" stroke-linecap="round"><circle cx="223" cy="63.5" r="4"/><path d="M 215.5 76 Q 216 69 223 69 Q 230 69 230.5 76"/></g>
