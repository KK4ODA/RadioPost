<rect x="0" y="0" width="1000" height="450" fill="#ffffff"/>
<text xml:space="preserve" x="24.0" y="30.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e293b" text-anchor="start">Before: your mail is copied ahead</text>
