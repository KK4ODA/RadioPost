<rect x="24.0" y="226.0" width="220.0" height="104.0" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text xml:space="preserve" x="38.0" y="251.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="650" fill="#1d4ed8" text-anchor="start">You call</text>
<text xml:space="preserve" x="38.0" y="274.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1e293b" text-anchor="start">Mail both ways</text>
<text xml:space="preserve" x="38.0" y="297.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">What you send shows</text>
<text xml:space="preserve" x="38.0" y="316.6" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">queued at KK4ODA-1</text>
<g fill="none" stroke="#1d4ed8" stroke-width="1.6" stroke-linecap="round"><circle cx="223" cy="243.5" r="4"/><path d="M 215.5 256 Q 216 249 223 249 Q 230 249 230.5 256"/></g>
<rect x="390.0" y="226.0" width="220.0" height="104.0" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
<text xml:space="preserve" x="404.0" y="251.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="650" fill="#c2410c" text-anchor="start">The gateway</text>
<text xml:space="preserve" x="404.0" y="274.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1e293b" text-anchor="start">Serves the copies</text>
<text xml:space="preserve" x="404.0" y="297.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">and keeps what you</text>
<text xml:space="preserve" x="404.0" y="316.6" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">send, to report later</text>
<g fill="none" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round"><path d="M 589 244 L 589 256 M 585 256 L 593 256"/><circle cx="589" cy="243" r="1.6" fill="#c2410c"/><path d="M 585 239.5 Q 582.5 243 585 246.5"/><path d="M 593 239.5 Q 595.5 243 593 246.5"/><path d="M 581.5 237 Q 578 243 581.5 249"/><path d="M 596.5 237 Q 600 243 596.5 249"/></g>
<rect x="756.0" y="226.0" width="220.0" height="104.0" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text xml:space="preserve" x="770.0" y="251.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="650" fill="#047857" text-anchor="start">Your post office</text>
<text xml:space="preserve" x="770.0" y="274.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1e293b" text-anchor="start">Out of reach</text>
<text xml:space="preserve" x="770.0" y="297.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">the Internet is down</text>
<text xml:space="preserve" x="770.0" y="316.6" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">at the gateway</text>
<g fill="none" stroke="#047857" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="946" y="241" width="18" height="13" rx="2"/><path d="M 946 242 L 955 249 L 964 242"/></g>
