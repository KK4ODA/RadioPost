<path d="M 700.0 278.0 L 752.0 278.0" fill="none" stroke="#b91c1c" stroke-width="2.0" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="24.0" y="352.0" width="952.0" height="74.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text xml:space="preserve" x="38.0" y="376.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="start">After</text>
<text xml:space="preserve" x="38.0" y="396.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">When the Internet is back, the gateway reports each session to your post office, and your outbox marks the mail sent.</text>
<text xml:space="preserve" x="38.0" y="414.1" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">A partner gateway that still has the Internet can carry it sooner, by radio.</text>
