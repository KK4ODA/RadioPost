<path d="M 134.0 152.0 L 134.0 172.0 L 866.0 172.0 L 866.0 154.0" fill="none" stroke="#334155" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-internet)"/>
