<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="How RadioPost carries your email">
<defs><marker id="ah-radio" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/></marker><marker id="ah-internet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker><marker id="ah-smtp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d28d9"/></marker><marker id="ah-local" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><marker id="ah-fail" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/></marker></defs>
<rect x="0" y="0" width="1000" height="300" fill="#ffffff"/>
<rect x="24.0" y="40.0" width="196.0" height="112.0" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text xml:space="preserve" x="38.0" y="65.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="650" fill="#1d4ed8" text-anchor="start">Your station</text>
<text xml:space="preserve" x="38.0" y="88.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1e293b" text-anchor="start">RadioPost</text>
<text xml:space="preserve" x="38.0" y="111.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">The client program, with</text>
<text xml:space="preserve" x="38.0" y="130.6" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">Aether HF and your radio</text>
<g fill="none" stroke="#1d4ed8" stroke-width="1.6" stroke-linecap="round"><circle cx="199" cy="57.5" r="4"/><path d="M 191.5 70 Q 192 63 199 63 Q 206 63 206.5 70"/></g>
<rect x="282.0" y="40.0" width="196.0" height="112.0" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
<text xml:space="preserve" x="296.0" y="65.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="650" fill="#c2410c" text-anchor="start">A gateway</text>
<text xml:space="preserve" x="296.0" y="88.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1e293b" text-anchor="start">KK4ODA-1</text>
<text xml:space="preserve" x="296.0" y="111.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">Another amateur's station,</text>
<text xml:space="preserve" x="296.0" y="130.6" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">on the Internet</text>
<g fill="none" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round"><path d="M 457 58 L 457 70 M 453 70 L 461 70"/><circle cx="457" cy="57" r="1.6" fill="#c2410c"/><path d="M 453 53.5 Q 450.5 57 453 60.5"/><path d="M 461 53.5 Q 463.5 57 461 60.5"/><path d="M 449.5 51 Q 446 57 449.5 63"/><path d="M 464.5 51 Q 468 57 464.5 63"/></g>
<rect x="540.0" y="40.0" width="176.0" height="112.0" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text xml:space="preserve" x="554.0" y="65.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="650" fill="#047857" text-anchor="start">Your post office</text>
<text xml:space="preserve" x="554.0" y="88.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1e293b" text-anchor="start">radiopost.org</text>
<text xml:space="preserve" x="554.0" y="111.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">Keeps your mailbox,</text>
<text xml:space="preserve" x="554.0" y="130.6" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">sends and takes email</text>
<g fill="none" stroke="#047857" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="686" y="55" width="18" height="13" rx="2"/><path d="M 686 56 L 695 63 L 704 56"/></g>
<rect x="780.0" y="40.0" width="196.0" height="112.0" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text xml:space="preserve" x="794.0" y="65.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="650" fill="#6d28d9" text-anchor="start">Anyone with email</text>
<text xml:space="preserve" x="794.0" y="88.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1e293b" text-anchor="start">Gmail, Outlook…</text>
<text xml:space="preserve" x="794.0" y="111.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">Writes to you and gets</text>
<text xml:space="preserve" x="794.0" y="130.6" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">your answers as usual</text>
<g fill="none" stroke="#6d28d9" stroke-width="1.6" stroke-linecap="round"><circle cx="955" cy="61" r="8"/><ellipse cx="955" cy="61" rx="3.5" ry="8"/><path d="M 947 61 L 963 61"/></g>
<path d="M 224.0 96.0 L 278.0 96.0" fill="none" stroke="#c2410c" stroke-width="2.2" stroke-dasharray="8 5" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#ah-radio)" marker-end="url(#ah-radio)"/>
<text xml:space="preserve" x="251.0" y="88.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#c2410c" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">By radio</text>
<path d="M 482.0 96.0 L 536.0 96.0" fill="none" stroke="#334155" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#ah-internet)" marker-end="url(#ah-internet)"/>
<text xml:space="preserve" x="509.0" y="88.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">Internet</text>
<path d="M 720.0 96.0 L 776.0 96.0" fill="none" stroke="#6d28d9" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#ah-smtp)" marker-end="url(#ah-smtp)"/>
<text xml:space="preserve" x="748.0" y="88.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#6d28d9" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">Email</text>
<rect x="24.0" y="186.0" width="952.0" height="74.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text xml:space="preserve" x="38.0" y="210.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="start">In short</text>
<text xml:space="preserve" x="38.0" y="232.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Your address is an ordinary email address: name@radiopost.org. Mail for you waits at your post office until you call a gateway.</text>
<text xml:space="preserve" x="38.0" y="250.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Any gateway takes your call, whoever runs it. Two RadioPost stations can also send mail to each other directly, with no gateway.</text>
<path d="M 24.0 284.0 L 62.0 284.0" fill="none" stroke="#c2410c" stroke-width="2.2" stroke-dasharray="8 5" stroke-linecap="round" stroke-linejoin="round"/>
<text xml:space="preserve" x="70.0" y="288.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Over the air (HF or VHF)</text>
<path d="M 269.6 284.0 L 307.6 284.0" fill="none" stroke="#334155" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/>
<text xml:space="preserve" x="315.6" y="288.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Gateway and post office (HTTPS)</text>
<path d="M 563.5 284.0 L 601.5 284.0" fill="none" stroke="#6d28d9" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/>
<text xml:space="preserve" x="609.5" y="288.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Ordinary email (SMTP, IMAP)</text>
</svg>
