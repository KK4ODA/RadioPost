<g fill="none" stroke="#1d4ed8" stroke-width="1.6" stroke-linecap="round"><circle cx="955" cy="47.5" r="4"/><path d="M 947.5 60 Q 948 53 955 53 Q 962 53 962.5 60"/></g>
<path d="M 288.0 86.0 L 712.0 86.0" fill="none" stroke="#c2410c" stroke-width="2.2" stroke-dasharray="8 5" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#ah-radio)" marker-end="url(#ah-radio)"/>
<text xml:space="preserve" x="500.0" y="57.8" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#c2410c" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">Mail both ways, each station checked</text>
<text xml:space="preserve" x="500.0" y="74.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#c2410c" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">by its credential: no Internet needed</text>
