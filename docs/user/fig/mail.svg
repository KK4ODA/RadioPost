<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-label="How email comes in and goes out">
<defs><marker id="ah-radio" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/></marker><marker id="ah-internet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker><marker id="ah-smtp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d28d9"/></marker><marker id="ah-local" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><marker id="ah-fail" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/></marker></defs>
<rect x="0" y="0" width="1000" height="440" fill="#ffffff"/>
<text xml:space="preserve" x="24.0" y="30.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e293b" text-anchor="start">Coming in</text>
<rect x="24.0" y="46.0" width="200.0" height="124.0" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text xml:space="preserve" x="38.0" y="71.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="650" fill="#6d28d9" text-anchor="start">Someone writes</text>
<text xml:space="preserve" x="38.0" y="94.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1e293b" text-anchor="start">An email</text>
<text xml:space="preserve" x="38.0" y="117.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">to ana@radiopost.org,</text>
<text xml:space="preserve" x="38.0" y="136.6" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">from any provider</text>
<g fill="none" stroke="#6d28d9" stroke-width="1.6" stroke-linecap="round"><circle cx="203" cy="67" r="8"/><ellipse cx="203" cy="67" rx="3.5" ry="8"/><path d="M 195 67 L 211 67"/></g>
<rect x="272.0" y="46.0" width="200.0" height="124.0" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text xml:space="preserve" x="286.0" y="71.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="650" fill="#6d28d9" text-anchor="start">Port 25</text>
<text xml:space="preserve" x="286.0" y="94.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1e293b" text-anchor="start">Stalwart</text>
<text xml:space="preserve" x="286.0" y="117.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">takes the email, and</text>
<text xml:space="preserve" x="286.0" y="136.6" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">asks the door first</text>
<g fill="none" stroke="#6d28d9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="442" y="59" width="18" height="7" rx="1.5"/><rect x="442" y="68" width="18" height="7" rx="1.5"/><circle cx="446" cy="62.5" r="0.9" fill="#6d28d9"/><circle cx="446" cy="71.5" r="0.9" fill="#6d28d9"/></g>
<rect x="520.0" y="46.0" width="200.0" height="124.0" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text xml:space="preserve" x="534.0" y="71.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="650" fill="#047857" text-anchor="start">The door</text>
<text xml:space="preserve" x="534.0" y="94.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1e293b" text-anchor="start">Let it in?</text>
<text xml:space="preserve" x="534.0" y="117.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">On the accept list?</text>
<text xml:space="preserve" x="534.0" y="136.6" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">SPF, DKIM, DMARC?</text>
<text xml:space="preserve" x="534.0" y="156.1" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">Not encrypted?</text>
<rect x="768.0" y="46.0" width="208.0" height="124.0" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text xml:space="preserve" x="782.0" y="71.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="650" fill="#1d4ed8" text-anchor="start">Kept twice</text>
<text xml:space="preserve" x="782.0" y="94.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1e293b" text-anchor="start">For the radio</text>
<text xml:space="preserve" x="782.0" y="117.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">and in the mailbox</text>
<text xml:space="preserve" x="782.0" y="136.6" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">a mail program reads</text>
<g fill="none" stroke="#1d4ed8" stroke-width="1.6" stroke-linecap="round"><path d="M 955 64 L 955 76 M 951 76 L 959 76"/><circle cx="955" cy="63" r="1.6" fill="#1d4ed8"/><path d="M 951 59.5 Q 948.5 63 951 66.5"/><path d="M 959 59.5 Q 961.5 63 959 66.5"/><path d="M 947.5 57 Q 944 63 947.5 69"/><path d="M 962.5 57 Q 966 63 962.5 69"/></g>
<path d="M 228.0 108.0 L 268.0 108.0" fill="none" stroke="#6d28d9" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-smtp)"/>
<path d="M 476.0 108.0 L 516.0 108.0" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="2 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-local)"/>
<path d="M 724.0 108.0 L 764.0 108.0" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="2 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-local)"/>
<text xml:space="preserve" x="620.0" y="192.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#b91c1c" text-anchor="middle">No: refused, with the reason</text>
<text xml:space="preserve" x="24.0" y="234.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e293b" text-anchor="start">Going out</text>
<rect x="24.0" y="250.0" width="200.0" height="124.0" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text xml:space="preserve" x="38.0" y="275.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="650" fill="#1d4ed8" text-anchor="start">A user, by radio</text>
<text xml:space="preserve" x="38.0" y="298.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1e293b" text-anchor="start">Through a gateway</text>
<text xml:space="preserve" x="38.0" y="321.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">the gateway passes</text>
<text xml:space="preserve" x="38.0" y="340.6" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">the session on</text>
<g fill="none" stroke="#1d4ed8" stroke-width="1.6" stroke-linecap="round"><path d="M 203 268 L 203 280 M 199 280 L 207 280"/><circle cx="203" cy="267" r="1.6" fill="#1d4ed8"/><path d="M 199 263.5 Q 196.5 267 199 270.5"/><path d="M 207 263.5 Q 209.5 267 207 270.5"/><path d="M 195.5 261 Q 192 267 195.5 273"/><path d="M 210.5 261 Q 214 267 210.5 273"/></g>
<rect x="272.0" y="250.0" width="200.0" height="124.0" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text xml:space="preserve" x="286.0" y="275.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="650" fill="#047857" text-anchor="start">The post office</text>
<text xml:space="preserve" x="286.0" y="298.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1e293b" text-anchor="start">Makes the email</text>
<text xml:space="preserve" x="286.0" y="321.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">from the user's address,</text>
<text xml:space="preserve" x="286.0" y="340.6" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">with a Radio-Path line</text>
<g fill="none" stroke="#047857" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="442" y="265" width="18" height="13" rx="2"/><path d="M 442 266 L 451 273 L 460 266"/></g>
<rect x="520.0" y="250.0" width="200.0" height="124.0" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text xml:space="preserve" x="534.0" y="275.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="650" fill="#6d28d9" text-anchor="start">Port 465, on the server</text>
<text xml:space="preserve" x="534.0" y="298.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1e293b" text-anchor="start">Stalwart</text>
<text xml:space="preserve" x="534.0" y="321.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">signs it (DKIM)</text>
<text xml:space="preserve" x="534.0" y="340.6" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">and sends it</text>
<g fill="none" stroke="#6d28d9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="690" y="263" width="18" height="7" rx="1.5"/><rect x="690" y="272" width="18" height="7" rx="1.5"/><circle cx="694" cy="266.5" r="0.9" fill="#6d28d9"/><circle cx="694" cy="275.5" r="0.9" fill="#6d28d9"/></g>
<rect x="768.0" y="250.0" width="208.0" height="124.0" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text xml:space="preserve" x="782.0" y="275.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="650" fill="#6d28d9" text-anchor="start">Anyone</text>
<text xml:space="preserve" x="782.0" y="298.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1e293b" text-anchor="start">Email arrives</text>
<text xml:space="preserve" x="782.0" y="321.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">in a minute or so</text>
<g fill="none" stroke="#6d28d9" stroke-width="1.6" stroke-linecap="round"><circle cx="955" cy="271" r="8"/><ellipse cx="955" cy="271" rx="3.5" ry="8"/><path d="M 947 271 L 963 271"/></g>
<path d="M 228.0 312.0 L 268.0 312.0" fill="none" stroke="#334155" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-internet)"/>
<path d="M 476.0 312.0 L 516.0 312.0" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="2 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-local)"/>
<path d="M 724.0 312.0 L 764.0 312.0" fill="none" stroke="#6d28d9" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-smtp)"/>
<path d="M 24.0 426.0 L 62.0 426.0" fill="none" stroke="#334155" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/>
<text xml:space="preserve" x="70.0" y="430.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Gateway and post office (HTTPS)</text>
<path d="M 317.9 426.0 L 355.9 426.0" fill="none" stroke="#6d28d9" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/>
<text xml:space="preserve" x="363.9" y="430.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Ordinary email (SMTP, IMAP)</text>
<path d="M 584.2 426.0 L 622.2 426.0" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="2 4" stroke-linecap="round" stroke-linejoin="round"/>
<text xml:space="preserve" x="630.2" y="430.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">On the same computer</text>
</svg>
