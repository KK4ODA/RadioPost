<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-label="A backup mail server">
<defs><marker id="ah-radio" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/></marker><marker id="ah-internet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker><marker id="ah-smtp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d28d9"/></marker><marker id="ah-local" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><marker id="ah-fail" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/></marker></defs>
<rect x="0" y="0" width="1000" height="360" fill="#ffffff"/>
<rect x="24.0" y="110.0" width="210.0" height="112.0" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text xml:space="preserve" x="38.0" y="135.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="650" fill="#6d28d9" text-anchor="start">Someone writes</text>
<text xml:space="preserve" x="38.0" y="158.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1e293b" text-anchor="start">Their mail server</text>
<text xml:space="preserve" x="38.0" y="181.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">tries MX 10 first,</text>
<text xml:space="preserve" x="38.0" y="200.6" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">then MX 20</text>
<g fill="none" stroke="#6d28d9" stroke-width="1.6" stroke-linecap="round"><circle cx="213" cy="131" r="8"/><ellipse cx="213" cy="131" rx="3.5" ry="8"/><path d="M 205 131 L 221 131"/></g>
<rect x="396.0" y="20.0" width="250.0" height="112.0" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text xml:space="preserve" x="410.0" y="45.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="650" fill="#047857" text-anchor="start">MX 10: your post office</text>
<text xml:space="preserve" x="410.0" y="68.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1e293b" text-anchor="start">po.radiopost.org</text>
<text xml:space="preserve" x="410.0" y="91.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">down for a while</text>
<text xml:space="preserve" x="410.0" y="110.6" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">(an outage, an update)</text>
<g fill="none" stroke="#047857" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="616" y="35" width="18" height="13" rx="2"/><path d="M 616 36 L 625 43 L 634 36"/></g>
<rect x="396.0" y="200.0" width="250.0" height="124.0" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text xml:space="preserve" x="410.0" y="225.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="650" fill="#6d28d9" text-anchor="start">MX 20: the backup</text>
<text xml:space="preserve" x="410.0" y="248.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1e293b" text-anchor="start">mx2.radiopost.org</text>
<text xml:space="preserve" x="410.0" y="271.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">Stalwart and its own door,</text>
<text xml:space="preserve" x="410.0" y="290.6" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">judging with a copy of the</text>
<text xml:space="preserve" x="410.0" y="310.1" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">accounts and accept lists</text>
<g fill="none" stroke="#6d28d9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="616" y="213" width="18" height="7" rx="1.5"/><rect x="616" y="222" width="18" height="7" rx="1.5"/><circle cx="620" cy="216.5" r="0.9" fill="#6d28d9"/><circle cx="620" cy="225.5" r="0.9" fill="#6d28d9"/></g>
<path d="M 238.0 150.0 L 300.0 92.0 L 392.0 76.0" fill="none" stroke="#b91c1c" stroke-width="2.0" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-fail)"/>
<circle cx="318.0" cy="82.0" r="12" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/><path d="M 313.0 77.0 L 323.0 87.0 M 323.0 77.0 L 313.0 87.0" stroke="#b91c1c" stroke-width="2.4" stroke-linecap="round"/>
<path d="M 238.0 190.0 L 392.0 262.0" fill="none" stroke="#6d28d9" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-smtp)"/>
<text xml:space="preserve" x="322.7" y="219.6" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#6d28d9" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">Takes the mail</text>
<path d="M 650.0 262.0 L 800.0 262.0 L 800.0 76.0 L 650.0 76.0" fill="none" stroke="#6d28d9" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-smtp)"/>
<text xml:space="preserve" x="812.0" y="129.8" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#6d28d9" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">Hands it on when</text>
<text xml:space="preserve" x="812.0" y="145.4" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#6d28d9" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">the post office is back,</text>
<text xml:space="preserve" x="812.0" y="161.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#6d28d9" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">its verdicts sealed</text>
<path d="M 560.0 136.0 L 560.0 196.0" fill="none" stroke="#334155" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-internet)"/>
<text xml:space="preserve" x="570.0" y="148.4" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">A copy every</text>
<text xml:space="preserve" x="570.0" y="164.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">five minutes</text>
<path d="M 24.0 348.0 L 62.0 348.0" fill="none" stroke="#334155" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/>
<text xml:space="preserve" x="70.0" y="352.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Gateway and post office (HTTPS)</text>
<path d="M 317.9 348.0 L 355.9 348.0" fill="none" stroke="#6d28d9" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/>
<text xml:space="preserve" x="363.9" y="352.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Ordinary email (SMTP, IMAP)</text>
<path d="M 584.2 348.0 L 622.2 348.0" fill="none" stroke="#b91c1c" stroke-width="2.0" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round"/>
<text xml:space="preserve" x="630.2" y="352.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Not answering</text>
</svg>
