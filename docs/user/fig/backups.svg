<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="Backups: made on the server, kept off it">
<defs><marker id="ah-radio" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/></marker><marker id="ah-internet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker><marker id="ah-smtp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d28d9"/></marker><marker id="ah-local" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><marker id="ah-fail" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/></marker></defs>
<rect x="0" y="0" width="1000" height="330" fill="#ffffff"/>
<rect x="24.0" y="40.0" width="280.0" height="150.0" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text xml:space="preserve" x="38.0" y="65.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="650" fill="#047857" text-anchor="start">Each night, on the server</text>
<text xml:space="preserve" x="38.0" y="88.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1e293b" text-anchor="start">Two backups</text>
<text xml:space="preserve" x="38.0" y="111.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">The post office: its key,</text>
<text xml:space="preserve" x="38.0" y="130.6" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">accounts and state (7 kept)</text>
<text xml:space="preserve" x="38.0" y="150.1" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">The mailboxes, Stalwart</text>
<text xml:space="preserve" x="38.0" y="169.7" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">stopped a moment (3 kept)</text>
<g fill="none" stroke="#047857" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="274" y="53" width="18" height="7" rx="1.5"/><rect x="274" y="62" width="18" height="7" rx="1.5"/><circle cx="278" cy="56.5" r="0.9" fill="#047857"/><circle cx="278" cy="65.5" r="0.9" fill="#047857"/></g>
<rect x="396.0" y="20.0" width="280.0" height="112.0" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text xml:space="preserve" x="410.0" y="45.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="650" fill="#1d4ed8" text-anchor="start">By itself, while RadioPost is open</text>
<text xml:space="preserve" x="410.0" y="68.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1e293b" text-anchor="start">Your computer</text>
<text xml:space="preserve" x="410.0" y="91.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">fetches each new one,</text>
<text xml:space="preserve" x="410.0" y="110.6" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">sealed to its own key</text>
<g fill="none" stroke="#1d4ed8" stroke-width="1.6" stroke-linecap="round"><circle cx="655" cy="37.5" r="4"/><path d="M 647.5 50 Q 648 43 655 43 Q 662 43 662.5 50"/></g>
<rect x="396.0" y="152.0" width="280.0" height="112.0" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text xml:space="preserve" x="410.0" y="177.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="650" fill="#1d4ed8" text-anchor="start">By hand, from the desk</text>
<text xml:space="preserve" x="410.0" y="200.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1e293b" text-anchor="start">Download a backup</text>
<text xml:space="preserve" x="410.0" y="223.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">sealed with a passphrase</text>
<text xml:space="preserve" x="410.0" y="242.6" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">you choose</text>
<g fill="none" stroke="#1d4ed8" stroke-width="1.6" stroke-linecap="round"><circle cx="651" cy="173" r="4"/><path d="M 655 173 L 664 173 M 661 173 L 661 177 M 664 173 L 664 176"/></g>
<rect x="768.0" y="86.0" width="208.0" height="112.0" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text xml:space="preserve" x="782.0" y="111.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="650" fill="#475569" text-anchor="start">If the server is lost</text>
<text xml:space="preserve" x="782.0" y="134.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1e293b" text-anchor="start">Restore</text>
<text xml:space="preserve" x="782.0" y="157.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">on a new server,</text>
<text xml:space="preserve" x="782.0" y="176.6" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">mailboxes and all</text>
<g fill="none" stroke="#475569" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M 948 98 L 958 98 L 962 102 L 962 116 L 948 116 Z"/><path d="M 951 106 L 959 106 M 951 109.5 L 959 109.5 M 951 113 L 956 113"/></g>
<path d="M 308.0 100.0 L 392.0 76.0" fill="none" stroke="#334155" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-internet)"/>
<path d="M 308.0 130.0 L 392.0 208.0" fill="none" stroke="#334155" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-internet)"/>
<path d="M 680.0 76.0 L 764.0 130.0" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="2 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-local)"/>
<path d="M 680.0 208.0 L 764.0 156.0" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="2 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-local)"/>
<text xml:space="preserve" x="24.0" y="294.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">A backup that stays on the server is lost with it. The desk's Health turns amber 7 days after a copy last left the server, and red after 30.</text>
</svg>
